<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070B14" />
    
    <!-- Primary SEO Metadata -->
    <title>Bloom & Box | Luxury Gift Hampers & Premium Gifting</title>
    <meta name="description" content="Discover Bloom & Box: The premier boutique for curated luxury gift hampers, exquisite floral arrangements, and premium artisan gifts. Handcrafted to order under our signature royal gold aesthetic with pristine standard and custom delivery options." />
    <meta name="keywords" content="luxury hampers, premium gifting, boutique flower boxes, hand-crafted packages, luxury gift baskets, curated hampers, corporate gifts, premium floral design, Bloom and Box" />
    <meta name="author" content="Bloom & Box" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://bloomandbox.luxury" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bloomandbox.luxury" />
    <meta property="og:title" content="Bloom & Box | Luxury Gift Hampers & Premium Gifting" />
    <meta property="og:description" content="Discover Bloom & Box: The premier boutique for curated luxury gift hampers, exquisite floral arrangements, and premium artisan gifts." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1549465220-1a8b9238cd48?q=80&w=1200&auto=format&fit=crop" />
    <meta property="og:image:alt" content="Bloom & Box Luxury Curated Hampers" />
    <meta property="og:site_name" content="Bloom & Box" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://bloomandbox.luxury" />
    <meta name="twitter:title" content="Bloom & Box | Luxury Gift Hampers & Premium Gifting" />
    <meta name="twitter:description" content="Discover Bloom & Box: Premium curated gift hampers and exceptional hand-crafted floral designs for discerning individuals." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1549465220-1a8b9238cd48?q=80&w=1200&auto=format&fit=crop" />
    <meta name="twitter:image:alt" content="Bloom & Box Luxury Curated Hampers" />

    <!-- Structured Data: Organization & e-Commerce Search (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "@id": "https://bloomandbox.luxury/#store",
        "name": "Bloom & Box",
        "url": "https://bloomandbox.luxury",
        "logo": "https://images.unsplash.com/photo-1549465220-1a8b9238cd48?q=80&w=800",
        "description": "Premium luxury e-commerce platform for bespoke gifting, artisan hampers, and high-end floral creations.",
        "telephone": "+1-800-BLOOM-BOX",
        "priceRange": "$$$$",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "100 Royal Plaza, Suite 400",
          "addressLocality": "Beverly Hills",
          "addressRegion": "CA",
          "postalCode": "90210",
          "addressCountry": "US"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 34.0736,
          "longitude": -118.4004
        },
        "sameAs": [
          "https://www.instagram.com/bloomandbox.luxury",
          "https://www.pinterest.com/bloomandbox"
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "url": "https://bloomandbox.luxury",
        "name": "Bloom & Box",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://bloomandbox.luxury/?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/frontend/main.tsx"></script>
  </body>
</html>
